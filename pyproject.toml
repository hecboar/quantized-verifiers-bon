[project]
name = "vq"
version = "0.1.0"
description = "Quantized verifiers for Best-of-N: experiments for the Neurocomputing paper"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "datasets>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "math-verify>=0.7",
    "requests>=2.31",
    "accelerate>=1.0",
]

[project.optional-dependencies]
# flash-attn is deliberately absent: it compiles from source on the pod (paid time); SDPA is used
# vllm pinned to the version validated by the pilot (it pins torch==2.13.0, CUDA 13.0)
gpu = ["vllm==0.30.0", "bitsandbytes>=0.45"]
# only for phase 6 (packed GPTQ kernels); may compile CUDA extensions
packed = ["gptqmodel>=2.0", "optimum>=1.24"]
dev = ["pytest>=8", "bitsandbytes>=0.45"]  # bnb: CPU parity test for NF4
paper = ["matplotlib>=3.8"]  # scripts/make_figures.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet / HF download", "slow: slow CPU test"]
addopts = "-m 'not network and not slow'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]
